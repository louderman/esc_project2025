name: Run Vitest and Jest Tests
on:
  push:
    branches:
      - '**'

jobs:
  frontend-tests:
    if: github.event_name != 'push' || github.event.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install client dependencies
        run: npm install
        working-directory: ./client
      - name: Run Vitest (frontend tests)
        run: npx vitest run
        working-directory: ./client

  backend-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.pull_request == null
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm install
        working-directory: ./server
      - name: Run Jest (backend tests)
        run: npm test
        working-directory: ./server
